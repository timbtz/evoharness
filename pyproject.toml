[project]
name = "evoharness"
version = "0.1.0"
description = "Modular LLM code-evolution optimizer: 5 swappable design axes, 3 PoC tasks"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "tsplib95>=0.7.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
